<template id="sc-opening-template">
  <div data-composition-id="sc-opening" data-start="0" data-duration="{{DUR}}" data-width="{{W}}" data-height="{{H}}">
    <div class="scp-bg"></div>
    <div class="scp-glow"></div>
    <div class="scp-all">
      <div class="scp-brand">
        <div class="scp-logo">{{PARTS}}</div>
        <div class="scp-word">{{WORDMARK}}</div>
      </div>
      <div class="scp-text">
        <div class="scp-title">{{TITLE}}</div>
        <div class="scp-kicker">{{KICKER}}</div>
      </div>
    </div>

    <style>
      [data-composition-id="sc-opening"] { position: absolute; inset: 0; overflow: hidden; font-family: Montserrat, Arial, sans-serif; --u: {{U}}px; }
      [data-composition-id="sc-opening"] .scp-bg { position: absolute; inset: 0; background: #050507; }
      [data-composition-id="sc-opening"] .scp-glow { position: absolute; inset: 0; background: radial-gradient(circle at 28% 30%, rgba(250,4,135,.24), transparent 45%), radial-gradient(circle at 72% 34%, rgba(3,233,247,.22), transparent 45%); }
      [data-composition-id="sc-opening"] .scp-all { position: absolute; inset: 0; }
      [data-composition-id="sc-opening"] .scp-brand { position: absolute; left: 0; right: 0; top: {{BRAND_TOP}}px; display: flex; flex-direction: column; align-items: center; gap: calc(16 * var(--u)); }
      [data-composition-id="sc-opening"] .scp-logo { position: relative; width: {{LOGO_W}}px; height: {{LOGO_H}}px; }
      [data-composition-id="sc-opening"] .scp-part { position: absolute; display: block; }
      [data-composition-id="sc-opening"] .scp-part img { display: block; width: 100%; height: 100%; }
      [data-composition-id="sc-opening"] .scp-part .scp-halo { position: absolute; inset: 0; filter: blur(calc(14 * var(--u))); opacity: .75; }
      [data-composition-id="sc-opening"] .scp-word { font-weight: 800; font-size: calc(46 * var(--u)); letter-spacing: calc(-1 * var(--u)); line-height: 1; white-space: nowrap; }
      [data-composition-id="sc-opening"] .scp-word .p, [data-composition-id="sc-opening"] .pk { color: #FF3FA4; text-shadow: 0 0 calc(22 * var(--u)) rgba(250,4,135,.75); }
      [data-composition-id="sc-opening"] .scp-word .c, [data-composition-id="sc-opening"] .cy { color: #2DF0FF; text-shadow: 0 0 calc(22 * var(--u)) rgba(3,233,247,.75); }
      [data-composition-id="sc-opening"] .scp-text { position: absolute; left: 0; right: 0; top: {{TEXT_TOP}}px; display: flex; flex-direction: column; align-items: center; gap: calc(34 * var(--u)); padding: 0 calc(70 * var(--u)); }
      [data-composition-id="sc-opening"] .scp-title { max-width: {{TITLE_MAX}}px; text-align: center; font-weight: 800; font-size: calc({{TITLE_SIZE}} * var(--u)); line-height: 1.04; letter-spacing: calc(-2.5 * var(--u)); color: #fff; text-transform: uppercase; }
      [data-composition-id="sc-opening"] .scp-title .w { display: inline-block; margin: 0 calc(10 * var(--u)); }
      [data-composition-id="sc-opening"] .scp-title .br { display: block; height: 0; }
      [data-composition-id="sc-opening"] .scp-kicker { font-weight: 800; font-size: calc(74 * var(--u)); line-height: 1; letter-spacing: calc(-1.5 * var(--u)); text-transform: uppercase; color: #fff; padding: calc(14 * var(--u)) calc(34 * var(--u)); border-radius: calc(22 * var(--u)); border: calc(3 * var(--u)) solid rgba(3,233,247,.7); background: rgba(3,233,247,.08); box-shadow: 0 0 calc(40 * var(--u)) rgba(3,233,247,.35); }
      [data-composition-id="sc-opening"] .scp-kicker:empty { display: none; }
    </style>

    <script>
      (() => {
        const T = {{TIMING}};
        const W = {{W}}, H = {{H}};
        const q = (s) => `[data-composition-id="sc-opening"] ${s}`;
        const tl = gsap.timeline({ paused: true });

        tl.from(q('.scp-glow'), { opacity: 0, scale: 1.3, duration: 1.1, ease: 'power2.out' }, 0);

        // Logo builds big in the centre, then rises to make room for the title.
        tl.fromTo(q('.scp-brand'), { y: {{BRAND_DY}}, scale: 1.45 }, { y: 0, scale: 1, duration: 0.5, ease: 'power3.inOut' }, T.rise);
        tl.from(q('.p-brace-left'), { x: -W * 0.45, rotation: -25, opacity: 0, duration: 0.5, ease: 'back.out(1.6)' }, T.braces);
        tl.from(q('.p-brace-right'), { x: W * 0.45, rotation: 25, opacity: 0, duration: 0.5, ease: 'back.out(1.6)' }, T.braces + 0.02);
        [[0, 0.3], [0.05, 1], [0.1, 0.45], [0.15, 1]].forEach(([dt, o]) =>
          tl.set([q('.p-brace-left'), q('.p-brace-right')], { opacity: o }, T.flicker + dt));
        tl.from(q('.p-fork'), { y: -H * 0.3, rotation: -540, scale: 0.4, opacity: 0, duration: T.forkLand - T.fork, ease: 'power3.out' }, T.fork);
        tl.fromTo(q('.p-fork'), { scaleY: 0.86, scaleX: 1.12 }, { scaleY: 1, scaleX: 1, duration: 0.35, ease: 'elastic.out(1.2, 0.4)' }, T.forkLand);
        tl.fromTo(q('.scp-halo'), { opacity: 0.4 }, { opacity: 1, duration: 0.3, ease: 'power2.out', yoyo: true, repeat: 1 }, T.forkLand);
        tl.from(q('.scp-word span'), { y: 24, opacity: 0, duration: 0.25, ease: 'back.out(2.2)', stagger: 0.02 }, T.forkLand - 0.05);

        // Title words slam in one by one, the kicker lands last.
        tl.from(q('.scp-title .w'), { y: 70, opacity: 0, scale: 1.35, duration: 0.3, ease: 'back.out(1.8)', stagger: T.wordStep }, T.title);
        tl.from(q('.scp-kicker'), { scale: 2.2, opacity: 0, rotation: -4, duration: 0.32, ease: 'power4.out' }, T.kicker);
        tl.fromTo(q('.scp-kicker'), { boxShadow: '0 0 0 0 rgba(3,233,247,.8)' }, { boxShadow: '0 0 0 calc(40 * var(--u)) rgba(3,233,247,0)', duration: 0.7, ease: 'power2.out' }, T.kicker + 0.2);
        tl.fromTo(q('.scp-all'), { scale: 1 }, { scale: 1.04, duration: {{DUR}} - T.title, ease: 'none' }, T.title);
        tl.to(q('.p-fork'), { rotation: 8, duration: 0.3, ease: 'sine.inOut', yoyo: true, repeat: 1 }, T.kicker + 0.3);

        // Crossfade into the first spoken line.
        tl.to([q('.scp-bg'), q('.scp-glow'), q('.scp-all')], { opacity: 0, duration: {{DUR}} - T.fadeOut, ease: 'power1.in' }, T.fadeOut);
        tl.set([q('.scp-bg'), q('.scp-glow'), q('.scp-all')], { opacity: 0 }, {{DUR}} - 0.001);

        window.__timelines = window.__timelines || {};
        window.__timelines['sc-opening'] = tl;
      })();
    </script>
  </div>
</template>
